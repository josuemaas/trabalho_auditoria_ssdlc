name: Pipeline SSDLC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validar-aplicacao:
    name: Validar aplicacao PHP e seguranca
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite
          coverage: none

      - name: Exibir versao do PHP
        run: php -v

      - name: Verificar sintaxe dos arquivos PHP
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Criar banco de dados de teste
        run: php database/criar_banco.php

      - name: Verificar banco criado
        run: test -f database/sistema.sqlite

      - name: Executar analise SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy AWS EC2
    runs-on: ubuntu-latest
    needs: validar-aplicacao

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Atualizar aplicacao na EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /var/www/html
            sudo git pull origin main
            sudo php database/criar_banco.php
            sudo chown -R www-data:www-data /var/www/html/database
            sudo chmod -R 775 /var/www/html/database
            sudo apache2ctl configtest
            sudo systemctl restart apache2